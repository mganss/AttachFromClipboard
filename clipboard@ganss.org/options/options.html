<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css" type="text/css" />
  <title>Options</title>
  <script src="options.js" type="module"></script>
</head>

<body>

  <section>
    <h2 data-l10n-content="sectionImages"></h2>

    <div class="row">
      <label for="imageFormat" data-l10n-content="imageFormat"></label>
      <select id="imageFormat"></select>
    </div>
    <p class="hint" id="imageFormatHint" data-l10n-content="imageFormatHint"></p>
    <p class="hint warning" id="unsupportedHint" hidden></p>

    <div class="row" id="qualityRow">
      <label for="imageQuality" data-l10n-content="imageQuality"></label>
      <input type="range" id="imageQuality" min="10" max="100" step="1">
      <output id="imageQualityValue"></output>
    </div>
    <p class="hint" id="qualityHint" data-l10n-content="imageQualityHint"></p>

    <div class="row">
      <label for="maxDimension" data-l10n-content="maxDimension"></label>
      <input type="number" id="maxDimension" min="0" max="20000" step="1">
      <span class="unit" data-l10n-content="pixels"></span>
    </div>
    <p class="hint" data-l10n-content="maxDimensionHint"></p>
  </section>

</body>

</html>
