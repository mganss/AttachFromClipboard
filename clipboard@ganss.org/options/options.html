<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="options.css" type="text/css" />
  <title>Options</title>
  <script src="options.js" type="module"></script>
</head>

<body>

  <div style="font-size:small; margin-top:1em;">
    <label for="preferred_image_format" data-l10n-content="preferred_image_format">12</label>
    <select id="preferred_image_format">
      <option value="default" data-l10n-label="default_image_format">
      <option value="image/jpeg" label="JPEG">
      <option value="image/png" label="PNG">
      <option value="image/webp" label="WebP">
    </select>
  </div>

  <div style="font-size:small; margin-top:1em;">
    <label for="filename_prefix" data-l10n-content="filename_prefix">12</label>
    <input type="text" id="filename_prefix" maxlength="60" spellcheck="false">
  </div>

  <div style="font-size:small; margin-top:1em;">
    <label for="filename_scheme" data-l10n-content="filename_scheme">12</label>
    <select id="filename_scheme">
      <option value="counter" data-l10n-label="filename_scheme_counter">
      <option value="timestamp" data-l10n-label="filename_scheme_timestamp">
    </select>
  </div>

  <div style="font-size:small; margin-top:1em;">
    <span data-l10n-content="filename_preview">12</span>
    <code id="filename_preview"></code>
  </div>

</body>

</html>
